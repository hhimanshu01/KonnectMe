    <path d="M292 184 H455 Q468 184 468 197 V223 Q468 236 455 236 H322 L302 250 V236 H292 Q279 236 279 223 V197 Q279 184 292 184Z" fill="#1769f5"/>
    <rect x="301" y="200" width="135" height="8" rx="4" fill="#b8d5ff" opacity=".9"/><rect x="301" y="215" width="95" height="7" rx="3.5" fill="#8ebcff"/>
    <rect x="183" y="259" width="185" height="45" rx="14" fill="#e4edff"/>
    <rect x="201" y="273" width="140" height="8" rx="4" fill="#b9cdf3"/><rect x="201" y="287" width="90" height="7" rx="3.5" fill="#c6d7f5"/>
    <rect x="179" y="310" width="295" height="9" rx="4.5" fill="#c9d9f3"/>
