      <path d="M20 0 H104 Q128 0 128 24 V83 Q128 106 104 106 H73 L48 128 V106 H20 Q0 106 0 83 V24 Q0 0 20 0Z" fill="#1769f5"/>
      <circle cx="31" cy="52" r="8" fill="#fff"/><circle cx="61" cy="52" r="8" fill="#fff"/><circle cx="91" cy="52" r="8" fill="#fff"/>
      <path d="M79 36 H133 Q153 36 153 56 V104 Q153 124 133 124 H125 V145 L99 124 H79 Q72 124 68 120 L93 99 H105 Q112 99 112 90 V56 Q112 46 103 46 H79Z" fill="#2461d9" opacity=".95"/>
