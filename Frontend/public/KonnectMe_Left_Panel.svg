  <path d="M0 900 C180 810 270 1000 450 930 S720 855 900 945 L900 1100 L0 1100Z" fill="#174fce" opacity=".92"/>
  <path d="M0 970 C190 915 310 1080 520 1015 S750 970 900 1020" fill="none" stroke="#80c5ff" stroke-width="3" opacity=".65"/>
  <path d="M0 205 C180 150 245 45 310 0" fill="none" stroke="#438df5" stroke-width="3" opacity=".8"/>
  <path d="M0 780 C180 760 240 920 425 890 S710 850 900 900" fill="none" stroke="#d9efff" stroke-width="3" opacity=".8"/>

  <!-- Brand -->
