    <path d="M-24 341 L544 341 L607 375 Q613 382 597 385 L-5 385 Q-24 383 -17 373Z" fill="url(#laptop)" stroke="#e5f1ff" stroke-width="3"/>
    <path d="M190 346 H335 L320 358 H204Z" fill="#7899c8" opacity=".8"/>
    <path d="M-6 376 Q280 390 598 376" fill="none" stroke="#fff" stroke-width="3" opacity=".8"/>
