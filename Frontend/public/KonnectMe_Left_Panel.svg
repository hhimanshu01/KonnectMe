    <text x="180" y="74" font-family="Inter, Arial, sans-serif" font-size="67" font-weight="800" letter-spacing="-2.5" fill="#08132f">Konnect<tspan fill="#1769f5">Me</tspan></text>
    <text x="182" y="118" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="400" fill="#58719d">Connect <tspan fill="#2e75df">·</tspan> Communicate <tspan fill="#2e75df">·</tspan> Collaborate</text>
  </g>

  <!-- Connection path -->
